<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; stroke: #dadce0; stroke-width: 2; rx: 8; }
    .box-copy-in { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; rx: 4; }
    .box-compute { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; rx: 4; }
    .box-copy-out { fill: #fce8e6; stroke: #d93025; stroke-width: 2; rx: 4; }
    .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #202124; text-anchor: middle; }
    .text-label { font-family: sans-serif; font-size: 12px; fill: #202124; text-anchor: middle; }
    .axis { stroke: #5f6368; stroke-width: 2; }
  </style>

  <rect class="bg" x="10" y="10" width="780" height="130" />
  <text x="400" y="35" class="text-title">Full Sequential Execution (One Big Iteration)</text>

  <!-- Timeline Axis -->
  <line x1="50" y1="110" x2="750" y2="110" class="axis" />

  <!-- One Big Iteration -->
  <rect class="box-copy-in" x="50" y="50" width="280" height="40" />
  <text x="190" y="75" class="text-label">Copy In (Entire Array)</text>

  <rect class="box-compute" x="330" y="50" width="140" height="40" />
  <text x="400" y="75" class="text-label">Compute</text>

  <rect class="box-copy-out" x="470" y="50" width="280" height="40" />
  <text x="610" y="75" class="text-label">Copy Out (Entire Array)</text>

</svg>
