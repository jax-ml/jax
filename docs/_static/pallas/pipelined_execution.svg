<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; stroke: #dadce0; stroke-width: 2; rx: 8; }
    .box-copy-in { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; rx: 4; }
    .box-compute { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; rx: 4; }
    .box-copy-out { fill: #fce8e6; stroke: #d93025; stroke-width: 2; rx: 4; }
    .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #202124; text-anchor: middle; }
    .text-label { font-family: sans-serif; font-size: 12px; fill: #202124; text-anchor: middle; }
    .text-header { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #5f6368; text-anchor: middle; }
    .axis { stroke: #5f6368; stroke-width: 1; stroke-dasharray: 2,2; }
  </style>

  <rect class="bg" x="10" y="10" width="780" height="280" />
  <text x="400" y="35" class="text-title">Pipelined Execution (Ideal Steady State)</text>

  <!-- Grid Headers -->
  <text x="200" y="70" class="text-header">Time Step 1</text>
  <text x="350" y="70" class="text-header">Time Step 2</text>
  <text x="500" y="70" class="text-header">Time Step 3</text>
  <text x="650" y="70" class="text-header">Time Step 4</text>

  <!-- Row Labels -->
  <text x="50" y="110" class="text-header" style="text-anchor: start;">Copy In</text>
  <text x="50" y="170" class="text-header" style="text-anchor: start;">Compute</text>
  <text x="50" y="230" class="text-header" style="text-anchor: start;">Copy Out</text>

  <!-- Grid Lines -->
  <line x1="125" y1="50" x2="125" y2="260" class="axis" />
  <line x1="275" y1="50" x2="275" y2="260" class="axis" />
  <line x1="425" y1="50" x2="425" y2="260" class="axis" />
  <line x1="575" y1="50" x2="575" y2="260" class="axis" />
  <line x1="725" y1="50" x2="725" y2="260" class="axis" />

  <!-- Time Step 1 -->
  <rect class="box-copy-in" x="140" y="90" width="120" height="40" />
  <text x="200" y="115" class="text-label">Copy In 0</text>

  <!-- Time Step 2 -->
  <rect class="box-copy-in" x="290" y="90" width="120" height="40" />
  <text x="350" y="115" class="text-label">Copy In 1</text>
  
  <rect class="box-compute" x="290" y="150" width="80" height="40" />
  <text x="330" y="175" class="text-label">Compute 0</text>

  <!-- Time Step 3 -->
  <rect class="box-copy-in" x="440" y="90" width="120" height="40" />
  <text x="500" y="115" class="text-label">Copy In 2</text>
  
  <rect class="box-compute" x="440" y="150" width="80" height="40" />
  <text x="480" y="175" class="text-label">Compute 1</text>
  
  <rect class="box-copy-out" x="440" y="210" width="120" height="40" />
  <text x="500" y="235" class="text-label">Copy Out 0</text>

  <!-- Time Step 4 -->
  <rect class="box-copy-in" x="590" y="90" width="120" height="40" />
  <text x="650" y="115" class="text-label">Copy In 3</text>
  
  <rect class="box-compute" x="590" y="150" width="80" height="40" />
  <text x="630" y="175" class="text-label">Compute 2</text>
  
  <rect class="box-copy-out" x="590" y="210" width="120" height="40" />
  <text x="650" y="235" class="text-label">Copy Out 1</text>

</svg>
