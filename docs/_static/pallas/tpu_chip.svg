<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; stroke: #dadce0; stroke-width: 3; rx: 16; }
    .tc-box { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; rx: 8; }
    .sc-box { fill: #fce8e6; stroke: #d93025; stroke-width: 2; rx: 8; }
    .text-title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #5f6368; text-anchor: middle; }
    .text-tc { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #0d652d; text-anchor: middle; }
    .text-sc { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #a50e0e; text-anchor: middle; }
    .text-desc { font-family: sans-serif; font-size: 14px; fill: #5f6368; text-anchor: middle; }
  </style>

  <!-- Main TPU Chip -->
  <rect class="bg" x="50" y="30" width="700" height="340" />
  <text x="400" y="65" class="text-title">TPU v7 Chip</text>
  <text x="400" y="85" class="text-desc">A single chip containing multiple heterogeneous cores</text>

  <!-- Left side: TensorCore and its SparseCores -->
  <!-- TensorCore -->
  <rect class="tc-box" x="100" y="120" width="250" height="150" />
  <text x="225" y="195" class="text-tc">TensorCore</text>

  <!-- SparseCores -->
  <rect class="sc-box" x="100" y="290" width="115" height="50" />
  <text x="157" y="320" class="text-sc">SparseCore</text>

  <rect class="sc-box" x="235" y="290" width="115" height="50" />
  <text x="292" y="320" class="text-sc">SparseCore</text>


  <!-- Right side: TensorCore and its SparseCores -->
  <!-- TensorCore -->
  <rect class="tc-box" x="450" y="120" width="250" height="150" />
  <text x="575" y="195" class="text-tc">TensorCore</text>

  <!-- SparseCores -->
  <rect class="sc-box" x="450" y="290" width="115" height="50" />
  <text x="507" y="320" class="text-sc">SparseCore</text>

  <rect class="sc-box" x="585" y="290" width="115" height="50" />
  <text x="642" y="320" class="text-sc">SparseCore</text>

</svg>
