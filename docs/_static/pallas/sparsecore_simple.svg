<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; }
    .box { fill: #ffffff; stroke: #202124; stroke-width: 2; rx: 8; }
    .box-hbm { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; rx: 8; }
    .box-subcore { fill: #ffffff; stroke: #5f6368; stroke-width: 2; rx: 8; }
    .box-scalar { fill: #ffffff; stroke: #9334e6; stroke-width: 2; rx: 8; }
    .text-title { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #202124; text-anchor: middle; }
    .text-small { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #202124; text-anchor: middle; }
    .text-program { font-family: monospace; font-size: 16px; font-weight: bold; fill: #1a73e8; text-anchor: middle; }
  </style>

  <!-- Background/Chip outline -->
  <rect class="bg" x="20" y="20" width="960" height="660" rx="16" stroke="#dadce0" stroke-width="3"/>
  <text x="500" y="60" class="text-title" fill="#80868b">SparseCore Architecture</text>

  <!-- HBM -->
  <rect class="box-hbm" x="100" y="90" width="800" height="60" />
  <text x="500" y="125" class="text-title">HBM (High Bandwidth Memory)</text>

  <!-- Program Types -->
  <rect x="90" y="155" width="140" height="20" fill="#e8f0fe" rx="10" />
  <text x="160" y="170" class="text-program">Scalar Program</text>

  <rect x="517" y="155" width="220" height="20" fill="#e8f0fe" rx="10" />
  <text x="627" y="170" class="text-program">SPMD Vector Program</text>
<!-- Scalar Subcore -->
<rect class="box-scalar" x="50" y="180" width="220" height="440" />
<text x="160" y="215" class="text-title">Scalar Subcore</text>

  <!-- Vector Subcore 0 -->
  <rect class="box-subcore" x="310" y="180" width="70" height="210" />
  <text x="345" y="285" class="text-small">VS 0</text>

  <!-- Vector Subcore 1 -->
  <rect class="box-subcore" x="388" y="180" width="70" height="210" />
  <text x="423" y="285" class="text-small">VS 1</text>

