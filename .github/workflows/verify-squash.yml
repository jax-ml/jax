name: Verify Squashed Commits

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-squash:
    if: github.repository_owner == 'jax-ml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check commit count
        id: check-commits
        shell: bash
        env:
          MAX_COMMITS: 1
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          SKIP_LABEL: 'skip-squash-check'
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          # Check if the skip label is present
          if jq -e --arg label "$SKIP_LABEL" 'any(.[]; .name == $label)' <<< "$PR_LABELS" >/dev/null; then
            echo "Skip label '$SKIP_LABEL' found. Bypassing squash check."
            exit 0
          fi

          if [ -z "$PR_COMMITS" ]; then
            echo "::error::This action must be run on a pull request event"
            exit 1
          fi

          echo "Found $PR_COMMITS commit(s) in PR"

          # Check if squashed
          if [ "$PR_COMMITS" -le "$MAX_COMMITS" ]; then
            echo "PR is squashed ($PR_COMMITS commit(s), max allowed: $MAX_COMMITS)"
          else
            echo "::error::PR is not squashed ($PR_COMMITS commit(s), max allowed: $MAX_COMMITS)"
            echo "::error::Please squash your commits before merging"
            echo "::error::For more information, see: https://docs.jax.dev/en/latest/contributing.html#single-change-commits-and-pull-requests"
            exit 1
          fi
