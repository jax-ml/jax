name: Multi-process run using K8s
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/k8s.yaml'
      - 'ci/k8s/**'
      - 'jax/distributed.py'
      - 'jax/_src/distributed.py'
      - 'jax/_src/clusters/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/k8s.yaml'
      - 'ci/k8s/**'
      - 'jax/distributed.py'
      - 'jax/_src/distributed.py'
      - 'jax/_src/clusters/**'

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash -ex -o pipefail {0}
jobs:
  distributed-initialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        controller: [jobset, indexed-job]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: jax
          persist-credentials: false
          
      - name: Start Minikube cluster
        uses: medyagh/setup-minikube@cea33675329b799adccc9526aa5daccc26cd5052 # v0.0.19

      - name: Install K8s Jobset
        if: matrix.controller == 'jobset'
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/jobset/releases/download/v0.8.0/manifests.yaml
          kubectl wait --for=condition=established crd/jobsets.jobset.x-k8s.io --timeout=60s
          kubectl rollout status -n jobset-system deploy/jobset-controller-manager --timeout=120s

      - name: Build image
        run: |
          cat > Dockerfile <<EOF
          FROM ubuntu:24.04
          ADD jax /opt/jax
          RUN DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y --no-install-recommends python-is-python3 python3-pip
          RUN pip install --break-system-packages -e '/opt/jax[ci,k8s]'
          EOF

          minikube image build -t local/jax:latest .
          minikube image ls | grep -q 'local/jax:latest'

      - name: Create service account for K8s job introspection
        run: kubectl apply -f jax/examples/k8s/svc-acct.yaml

      - name: Submit test job
        env:
          CONTROLLER: ${{ matrix.controller }}
        run: kubectl apply -f "jax/ci/k8s/${CONTROLLER}.yaml"

      - name: Check job status
        shell: bash -e -o pipefail {0}
        run: |
          max_attempts=100
          for attempt in $(seq 1 "$max_attempts"); do
            completion_time=$(
              kubectl get jobs -o yaml | \
              yq '.items[] | select(.metadata.name | test("^jaxjob")) | .status.completionTime'
            )
            failed=$(
              kubectl get jobs -o yaml | \
              yq '.items[] | select(.metadata.name | test("^jaxjob")) | .status.failed // 0'
            )
            timestamp=$(date +"%Y-%m-%d %H:%M:%S")
            echo "[$timestamp] Checking job status (attempt $attempt/$max_attempts)..."

            if [[ -n "$failed" && "$failed" != "0" && "$failed" != "null" ]]; then
              echo "[$timestamp] Job reported $failed failed pod(s)!"
              kubectl describe pods
              exit 1
            fi

            if [ -z "$completion_time" ] || [ "$completion_time" == "null" ]; then
              echo "[$timestamp] Job is still running. Current pod status:"
              pod_status=$(kubectl get pods --no-headers || true)
              echo "$pod_status"
              if echo "$pod_status" | grep -Eq 'ErrImagePull|ImagePullBackOff|ErrImageNeverPull'; then
                echo "[$timestamp] Pod image pull failed!"
                kubectl describe pods
                exit 1
              fi
              echo "[$timestamp] Waiting for 3 seconds before checking again..."
              sleep 3
            else
              succeeded=$(
                kubectl get jobs -o yaml | \
                yq '.items[] | select(.metadata.name | test("^jaxjob")) | .status.succeeded'
              )
              parallelism=$(
                kubectl get jobs -o yaml | \
                yq '.items[] | select(.metadata.name | test("^jaxjob")) | .spec.parallelism'
              )
              if [ -n "$succeeded" ] && [ "$succeeded" == "$parallelism" ]; then
                echo "[$timestamp] Job has completed successfully!"
                exit 0
              else
                echo "[$timestamp] Job has failed (succeeded=$succeeded, parallelism=$parallelism)!"
                kubectl describe pods
                exit 1
              fi
            fi
          done

          echo "Timed out waiting for K8s job to complete after $((max_attempts * 3))s."
          kubectl describe pods
          exit 1

      - name: Examine individual pod outputs
        if: ${{ !cancelled() }}
        run: |
          set +x
          kubectl get pods --no-headers | awk '{print $1}' | while read -rs pod; do
            echo "========================================"
            echo "Pod $pod output:"
            echo "----------------------------------------"
            kubectl logs "$pod"
            echo "========================================"
          done
