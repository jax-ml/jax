# CI - Pytest ROCm
#
# This workflow runs the ROCm tests with Pytest in ROCm team's GHCR containers.
# It can be triggered manually via workflow_dispatch or called by other workflows
# via workflow_call.
#
# It consists of the following job:
# run-tests:
#    - Runs in the rocmless container and pip-installs TheRock ROCm for `rocm-tag`.
#    - Downloads the JAX and jaxlib wheels from GCS, and ROCm plugins from S3.
#    - Executes the `run_pytest_rocm.sh` script, which performs the following actions:
#      - Installs the downloaded wheel artifacts.
#      - Runs the ROCm tests with Pytest.
name: CI - Pytest ROCm

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: choice
        default: "amd-do-linux.jax.gpu.gfx950.4"
        options:
          - "amd-do-linux.jax.gpu.gfx950.1"
          - "amd-do-linux.jax.gpu.gfx950.4"
          - "amd-do-linux.jax.gpu.gfx950.8"
      python:
        description: "Which Python version to use?"
        type: choice
        default: "3.12"
        options:
          - "3.12"
      rocm-version:
        description: "Which ROCm version to test?"
        type: choice
        default: "10"
        options:
          - "10"
      rocm-tag:
        description: "TheRock release to install: therock-<X.Y> or therock-latest"
        type: string
        default: "therock-10.0"
      rocm-release-version:
        description: "Release version for S3 path resolution (e.g., 7.2.0 or therock-latest)"
        type: string
        default: ""
      jaxlib-version:
        description: "Which jaxlib version to use? (head/pypi_latest)"
        type: choice
        default: "head"
        options:
          - "head"
          - "pypi_latest"
      skip-download-jaxlib-and-plugins-from-gcs:
        description: "Whether to skip downloading the jaxlib and plugins from GCS (e.g for testing a jax only release)"
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
      gcs_download_uri:
        description: "GCS location prefix from where the artifacts should be downloaded"
        type: string
        default: 'gs://jax-nightly-artifacts/latest'
      s3_download_uri:
        description: "S3 URI for ROCm plugin/PJRT wheels (use 'latest' to resolve via LATEST pointer)"
        type: string
        default: 'latest'
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
  workflow_call:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: string
        default: "amd-do-linux.jax.gpu.gfx950.4"
      python:
        description: "Which Python version to use?"
        type: string
        default: "3.12"
      rocm-version:
        description: "Which ROCm version to test?"
        type: string
        default: "10"
      rocm-tag:
        description: "TheRock release to install: therock-<X.Y> or therock-latest"
        type: string
        default: "therock-10.0"
      rocm-release-version:
        description: "Release version for S3 path resolution (e.g., 7.2.0 or therock-latest)"
        type: string
        default: ""
      jaxlib-version:
        description: "Which jaxlib version to use? (head/pypi_latest)"
        type: string
        default: "head"
      skip-download-jaxlib-and-plugins-from-gcs:
        description: "Whether to skip downloading the jaxlib and plugins from GCS (e.g for testing a jax only release)"
        default: '0'
        type: string
      gcs_download_uri:
        description: "GCS location prefix from where the artifacts should be downloaded"
        default: 'gs://jax-nightly-artifacts/latest'
        type: string
      s3_download_uri:
        description: "S3 URI for ROCm plugin/PJRT wheels (use 'latest' to resolve via LATEST pointer)"
        default: 'latest'
        type: string
      jax-jaxlib-source:
        description: "Where to take the base jax/jaxlib wheels from: 'upstream' (shared nightly bucket) or 'vendor' (the same store as the ROCm wheels)"
        default: 'upstream'
        type: string
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
      git_commit:
        description: "Commit SHA to check out for running tests"
        required: false
        default: ""
        type: string
permissions:
  id-token: write
  contents: read

env:
  UV_DEFAULT_INDEX: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"

jobs:
  run-tests:
    defaults:
      run:
        # Set the shell to bash as GitHub actions run with /bin/sh by default
        shell: bash
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    # Run in the rocmless build container (no ROCm baked in); ROCm is installed
    # per job from TheRock pip packages in the "Install TheRock" step below.
    container:
      image: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:fe966c6f77ad7dcd279bad02833d4cd70f72a9cd87640912ae37b20b3de7edea
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size 64G --env-file /etc/podinfo/gha-gpu-isolation-settings
    name: "${{ (contains(inputs.runner, 'gfx950.1') && 'gfx950 1-GPU') ||
        (contains(inputs.runner, 'gfx950.4') && 'gfx950 4-GPU') ||
        (contains(inputs.runner, 'gfx950.8') && 'gfx950 8-GPU') }}, ROCm ${{ inputs.rocm-release-version || inputs.rocm-version }}, py${{ inputs.python }}"

    env:
      JAXCI_HERMETIC_PYTHON_VERSION: "${{ inputs.python }}"
      JAXCI_PYTHON: "python${{ inputs.python }}"
      JAXCI_ENABLE_X64: "0"
      # Required on gfx950 with ROCm 7.13 to avoid HIP "invalid device function"
      # failures during multi-accelerator collectives. RCCL emits an explicit
      # warning when this is unset; the env var must be in place before HIP
      # initialization, which happens at JAX import time.
      HSA_NO_SCRATCH_RECLAIM: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_commit }}
          persist-credentials: false
      - name: Download JAX ROCm wheels
        uses: ./.github/actions/download-jax-rocm-wheels
        with:
          python: ${{ inputs.python }}
          rocm-version: ${{ inputs.rocm-version }}
          rocm-release-version: ${{ inputs.rocm-release-version }}
          jaxlib-version: ${{ inputs.jaxlib-version }}
          skip-download-jaxlib-and-plugins-from-gcs: ${{ inputs.skip-download-jaxlib-and-plugins-from-gcs }}
          gcs_download_uri: ${{ inputs.gcs_download_uri }}
          s3_download_uri: ${{ inputs.s3_download_uri }}
          jax-jaxlib-source: ${{ inputs.jax-jaxlib-source }}
      - name: Install TheRock (ROCm via pip)
        env:
          ROCM_TAG: ${{ inputs.rocm-tag }}
        run: |
          set -euo pipefail
          # Install the ROCm the jax-base-ubu24.<rocm-tag> image would carry
          # (index and pin from ROCm/rocm-jax build-base-docker.yml).
          case "${ROCM_TAG}" in
            therock-latest) index=https://nightly.repo.amd.com/rocm/whl-next/; pin="" ;;
            therock-7.14) index=https://repo.amd.com/rocm/whl-multi-arch/; pin=7.14 ;;
            therock-*) index=https://stable.repo.amd.com/rocm/whl-next/; pin="${ROCM_TAG#therock-}" ;;
            *) echo "::error::rocm-tag '${ROCM_TAG}' has no TheRock pip release"; exit 1 ;;
          esac
          # The runner's in-cluster mirror, when set, carries only the whl-next indexes.
          if [[ "${index}" == *whl-next* ]]; then index="${ROCM_PIP_INDEX_URL:-${index}}"; fi
          $JAXCI_PYTHON -m pip install --break-system-packages --pre --index-url "${index}" \
            "rocm[libraries,devel,device-gfx950]${pin:+==}${pin}"
          rocm-sdk init
          rocm-sdk path --root
      - name: Install Python dependencies
        run: |
          $JAXCI_PYTHON -m pip install uv~=0.12.3
          $JAXCI_PYTHON -m uv pip install -r build/test-requirements.txt
          $JAXCI_PYTHON -m pip install pytest-json-report
      # Halt for testing
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Pytest ROCm tests
        timeout-minutes: 120
        run: ./ci/run_pytest_rocm.sh
      - name: Archive test logs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tar -czf logs.tar.gz logs
      - name: Configure AWS Credentials
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::661452401056:role/jax-ci-amd-s3-oidc
          aws-region: us-east-1
      - name: Upload test-artifacts to AMD S3
        if: ${{ !cancelled() }}
        env:
          S3_BUCKET_NAME: jax-ci-amd
          INPUT_PYTHON: ${{ inputs.python }}
          INPUT_ROCM_VERSION: ${{ inputs.rocm-version }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_ROCM_TAG: ${{ inputs.rocm-tag }}
          IS_NIGHTLY: ${{ contains(github.workflow, 'Nightly/Release') && 'nightly' || 'continuous' }}
        run: |
          ./ci/upload_rocm_logs.sh
