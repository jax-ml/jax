# CI - Pytest CPU
#
# This workflow runs the CPU tests with Pytest. It can only be triggered by other workflows via
# `workflow_call`. It is used by the "CI - Wheel Tests" workflows to run the Pytest CPU tests.
#
# It consists of the following job:
# run-tests:
#    - Downloads the jaxlib wheel from a GCS bucket.
#    - Executes the `run_pytest_cpu.sh` script, which performs the following actions:
#      - Installs the downloaded jaxlib wheel.
#      - Runs the CPU tests with Pytest.
name: CI - Pytest CPU

on:
  workflow_call:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: string
        default: "linux-x86-n4-16"
      python:
        description: "Which python version should the artifact be built for?"
        type: string
        default: "3.12"
      enable-x64:
        description: "Should x64 mode be enabled?"
        type: string
        default: "0"
      skip-download-jaxlib-from-gcs:
        description: "Whether to skip downloading the jaxlib artifact from GCS (e.g for testing a jax only release)"
        default: '0'
        type: string
      gcs_download_uri:
        description: "GCS location prefix from where the artifacts should be downloaded"
        default: 'gs://general-ml-ci-transient/jax-github-actions/jax/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}'
        type: string
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
      max-processes:
        description: 'The value to set for `--maxprocesses` when running pytest. Leave empty to use max processes.'
        type: string
        default: ''
      git_commit:
        description: "Commit SHA to check out for running tests"
        required: false
        default: ""
        type: string

permissions: {}

env:
  UV_DEFAULT_INDEX: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"
  PIP_INDEX_URL: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"

jobs:
  run-tests:
    defaults:
      run:
        # Explicitly set the shell to bash to override Windows's default (cmd)
        shell: bash
    runs-on: ${{ inputs.runner }}
    container: ${{ (contains(inputs.runner, 'linux-x86') && 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest') || (contains(inputs.runner, 'linux-arm64') && 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-arm64:latest') || (contains(inputs.runner, 'windows-x86') && null) }}  # zizmor: ignore[unpinned-images]

    name: "${{ (contains(inputs.runner, 'linux-x86') && 'linux x86') ||
        (contains(inputs.runner, 'linux-arm64') && 'linux arm64') ||
        (contains(inputs.runner, 'windows-x86') && 'windows x86') }}, py${{ inputs.python }}, x64=${{ inputs.enable-x64 }}"

    env:
      JAXCI_HERMETIC_PYTHON_VERSION: "${{ inputs.python }}"
      # TODO(phawkins): Remove this workaround when python3.14t is present in the linux aarch64 image.
      JAXCI_PYTHON: ${{ (inputs.python == '3.14t' && contains(inputs.runner, 'linux-arm64')) && 'python3.14-nogil' || format('python{0}', inputs.python) }}
      JAXCI_ENABLE_X64: "${{ inputs.enable-x64 }}"
      MAX_PROCESSES: ${{ inputs.max-processes }}

    steps:
      - name: Checkout JAX
        id: checkout
        continue-on-error: ${{ contains(inputs.runner, 'windows-x86') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_commit }}
          persist-credentials: false
      - name: Diagnose failed Windows SHA checkout
        if: ${{ contains(inputs.runner, 'windows-x86') && steps.checkout.outcome == 'failure' }}
        env:
          CHECKOUT_COMMIT: ${{ inputs.git_commit || github.sha }}
        run: |
          set +e
          git rev-parse --verify --quiet "${CHECKOUT_COMMIT}^{object}"
          sha_status=$?
          git rev-parse --verify --quiet 'FETCH_HEAD^{object}'
          fetch_head_status=$?
          git cat-file -e "${CHECKOUT_COMMIT}^{commit}"
          cat_file_status=$?
          set -e

          echo "SHA lookup exit code: ${sha_status}"
          echo "FETCH_HEAD lookup exit code: ${fetch_head_status}"
          echo "Commit object lookup exit code: ${cat_file_status}"
          git rev-parse --show-object-format
          git show-ref || true
      - name: Checkout Windows SHA through a named ref
        if: ${{ contains(inputs.runner, 'windows-x86') && steps.checkout.outcome == 'failure' }}
        env:
          CHECKOUT_COMMIT: ${{ inputs.git_commit || github.sha }}
          CHECKOUT_REF: refs/remotes/origin/jaxci-wheel-build
        run: |
          if [[ ! "${CHECKOUT_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full SHA-1 commit, got ${CHECKOUT_COMMIT}" >&2
            exit 1
          fi

          git -c protocol.version=2 fetch \
            --no-tags \
            --prune \
            --no-recurse-submodules \
            --depth=1 \
            origin \
            "+${CHECKOUT_COMMIT}:${CHECKOUT_REF}"
          git checkout --force --detach "${CHECKOUT_REF}"

          actual_commit="$(git rev-parse HEAD)"
          if [[ "${actual_commit}" != "${CHECKOUT_COMMIT}" ]]; then
            echo "Expected commit ${CHECKOUT_COMMIT}, got ${actual_commit}" >&2
            exit 1
          fi
      - name: Download JAX CPU wheels
        uses: ./.github/actions/download-jax-cpu-wheels
        with:
          runner: ${{ inputs.runner }}
          python: ${{ inputs.python }}
          skip-download-jaxlib-from-gcs: ${{ inputs.skip-download-jaxlib-from-gcs }}
          gcs_download_uri: ${{ inputs.gcs_download_uri }}
      - name: Install Python dependencies
        run: |
          $JAXCI_PYTHON -m pip install uv~=0.12.3

          $JAXCI_PYTHON -m uv pip install -r build/test-requirements.txt
      # Halt for testing
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Pytest CPU tests
        timeout-minutes: 60
        run: ./ci/run_pytest_cpu.sh
      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-test-artifacts
        with:
          artifact-name: pytest-test-artifacts-${{ inputs.runner }}-py${{ inputs.python }}-x64_${{ inputs.enable-x64 }}
          inputs_json: ${{ toJSON(inputs) }}
          matrix_json: ${{ toJSON(matrix) }}
