name: Bazel CPU

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'no'
        options:
        - 'yes'
        - 'no'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/**'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main/release branches.
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && github.ref != 'main' }}

jobs:
  build-jax-artifact:
    if: github.repository_owner == 'jax-ml'
    uses: ./.github/workflows/build_artifacts.yml
    name: "Build jax artifact"
    with:
        # Note that since jax is a pure python package, the runner OS and Python values do not
        # matter. In addition, cloning main XLA also has no effect.
        runner: "linux-x86-n4-16"
        artifact: "jax"
        upload_artifacts_to_gcs: false

  build-jaxlib-artifact:
    if: github.repository_owner == 'jax-ml'
    uses: ./.github/workflows/build_artifacts.yml
    strategy:
        fail-fast: false # don't cancel all jobs on failure
        matrix:
            # Runner OS and Python values need to match the matrix stategy in the CPU tests job
            runner: ["linux-x86-n4-16", "linux-arm64-c4a-16", "windows-x86-n2-16"]
            artifact: ["jaxlib"]
            python: ["3.14"]
    # Note: For reasons unknown, Github actions groups jobs with the same top-level name in the
    # dashboard only if we use an expression in the "name" field. Otherwise, it appends the matrix
    # values to the name and creates a separate entry for each matrix combination.
    name: "${{ matrix.runner && 'Build wheel' }}"
    with:
        runner: ${{ matrix.runner }}
        artifact: ${{ matrix.artifact }}
        python: ${{ matrix.python }}
        clone_main_xla: 0
        upload_artifacts_to_gcs: false

  run_tests:
    if: github.event.repository.fork == false && github.repository_owner == 'jax-ml'
    uses: ./.github/workflows/bazel_cpu.yml
# Begin Presubmit Naming Check - name modification requires internal check to be updated
    strategy:
      matrix:
        python: ["3.12", "3.14"]
        runner: ["linux-x86-n4-16", "linux-arm64-c4a-16", "windows-x86-n2-16"]
        enable-x64: [1, 0]
        enable-bzlmod: [1, 0]
        exclude:
            # Exclude x64=1 on the oldest Python and x64=0 on the newest Python. As long as we have
            # coverage for one of each, we don't need to run both.
            - python: "3.12"
              enable-x64: 1
            - python: "3.14"
              enable-x64: 0
            # Only test a single Python version on Arm64 and Windows as we don't run the tests.
            - python: "3.12"
              runner: "linux-arm64-c4a-16"
            - python: "3.12"
              runner: "windows-x86-n2-16"
            # TODO: Just test against Python 3.12 with Bzlmod to avoid adding too much CI load.
            - python: "3.14"
              enable-bzlmod: 1
    name: "${{ (contains(matrix.runner, 'linux-x86') && 'Test' || 'Build') }}"
# End Presubmit Naming Check github-cpu-presubmits
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      halt-for-connection: ${{ inputs.halt-for-connection }}
      enable-x64:  ${{ matrix.enable-x64 }}
      enable-bzlmod:  ${{ matrix.enable-bzlmod }}
      build_jaxlib: ${{ 'true' }}
      build_jax: ${{ 'true' }}
      bazel_command: ${{ (contains(matrix.runner, 'linux-x86') && 'test') || 'build' }}
      clone_main_xla: 0
  
  temporary-test-download-windows:
    runs-on:  "windows-x86-n2-16"
    name: "Temporary Download Test on windows-x86-n2-16"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify Windows Image
        shell: bash
        run: |
          if [[ -d "/c/gcloud" ]]; then
            echo "New Windows runner image is ACTIVE!"
            which gcloud
          else
            echo "Old Windows runner image is still running."
            exit 1
          fi
      - name: Set dummy env keys for downloading action
        shell: bash
        run: echo "JAXCI_HERMETIC_PYTHON_VERSION=3.11" >> "$GITHUB_ENV"
      - name: Execute Download Action
        uses: ./.github/actions/download-jax-cpu-wheels
        with:
          runner: "windows-x86-n2-16"
          python: "3.11"
          skip-download-jaxlib-from-gcs: '1'
          gcs_download_uri: "gs://general-ml-ci-transient/jax-github-actions/jax-fork/CI - Wheel Tests (Continuous)/${{ github.run_id }}-${{ github.run_attempt }}"

  temporary-test-download-linux:
    runs-on:  "linux-x86-n4-16"
    name: "Temporary Download Test on linux-x86-n4-16"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set dummy env keys for downloading action
        shell: bash
        run: echo "JAXCI_HERMETIC_PYTHON_VERSION=3.11" >> "$GITHUB_ENV"
      - name: Execute Download Action
        uses: ./.github/actions/download-jax-cpu-wheels
        with:
          runner: "linux-x86-n4-16"
          python: "3.11"
          skip-download-jaxlib-from-gcs: '1'
          gcs_download_uri: "gs://general-ml-ci-transient/jax-github-actions/jax-fork/CI - Wheel Tests (Continuous)/${{ github.run_id }}-${{ github.run_attempt }}"


  temporary-test-upload-windows:
    uses: ./.github/workflows/build_artifacts.yml
    name: "Temporary Upload Test on windows-x86-n2-16"
    with:
      runner: "windows-x86-n2-16"
      artifact: "jax"
      upload_artifacts_to_gcs: true
      gcs_upload_uri: "gs://general-ml-ci-transient/jax-github-actions/jax-fork/CI - Wheel Tests (Continuous)/${{ github.run_id }}-${{ github.run_attempt }}"

  temporary-test-upload-linux:
    uses: ./.github/workflows/build_artifacts.yml
    name: "Temporary Upload Test on linux-x86-n4-16"
    with:
      runner: "linux-x86-n4-16"
      artifact: "jax"
      upload_artifacts_to_gcs: true
      gcs_upload_uri: "gs://general-ml-ci-transient/jax-github-actions/jax-fork/CI - Wheel Tests (Continuous)/${{ github.run_id }}-${{ github.run_attempt }}"
